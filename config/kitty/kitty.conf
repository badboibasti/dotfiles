# Font settings
font_family      Hack
font_size        14.0
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_ligatures yes

# Cursor
cursor_shape     beam
cursor_blink     yes

# Window padding
padding_width    10
padding_height   10

# Opacity (for transparency)
background_opacity 0.90

# Color theme (you can download a theme and include it here)
# For now, using default. Replace with your preferred theme path:
# include ~/.config/kitty/themes/dracula.conf

# Scrollback buffer
scrollback_lines 10000

# Tab bar
tab_bar_style    powerline
tab_powerline_style slanted 
active_tab_font_style bold
inactive_tab_font_style italic

# Window title formatting
window_margin_width 5
window_padding_width 5
dynamic_title yes

# Performance settings
repaint_delay    10
input_delay      1

# URL handling
detect_urls yes
open_url_with default

# Mouse and selection
mouse_hide_wait 3.0
select_by_word_characters @-./_~

# Color Theme
include ~/.config/kitty/themes/themes/Dracula.conf

# Deus Ex-Inspired Kitty Theme
background #1a1a1a
foreground #e0e0e0
cursor #ffcc00
color0  #1a1a1a
color1  #ffcc00
color2  #99cc33
color3  #ff6600
color4  #3366cc
color5  #cc33cc
color6  #33cccc
color7  #e0e0e0
color8  #808080
color9  #ffcc00
color10 #99cc33
color11 #ff6600
color12 #3366cc
color13 #cc33cc
color14 #33cccc
color15 #ffffff

